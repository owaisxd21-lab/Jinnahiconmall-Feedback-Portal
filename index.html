<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jinnah Icon Mall | Feedback Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='31' fill='%230A1730'/%3E%3Ccircle cx='32' cy='32' r='29' fill='none' stroke='%23C9A455' stroke-width='1.5'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' fill='%23C9A455' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#0A1730; --navy2:#102A4E; --navy3:#1B3A66; --navy-deep:#050C1B;
  --gold:#C9A455; --gold2:#A8792E; --gold-light:#E7D19C; --gold-tint:#F6EEDA;
  --ivory:#FBF9F4; --paper:#FFFFFF;
  --ink:#1A2333; --muted:#6B7280; --line:#E7E0D0;
  --ok:#1F7A5C; --ok-bg:#E7F5EF;
  --warn:#A9660A; --warn-bg:#FBF0DE;
  --new:#2A5DA8; --new-bg:#E8EFFA;
  --danger:#B3261E; --danger-bg:#FBEAEA;
  --radius:18px; --radius-sm:11px;
  --shadow:0 24px 60px -16px rgba(8,18,38,.22),0 6px 20px rgba(8,18,38,.08);
  --shadow-sm:0 3px 10px rgba(8,18,38,.05),0 1px 2px rgba(8,18,38,.06);
  --shadow-gold:0 10px 26px -6px rgba(169,124,46,.4);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;letter-spacing:.2px}
::selection{background:var(--gold-tint)}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px;border-radius:4px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#DCD5C0;border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:var(--gold2)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* header */
.top{min-height:80px;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(201,164,85,.18);display:flex;align-items:center;justify-content:space-between;padding:10px 30px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:22px}
.brand img{display:block;object-fit:contain}
.jinnah-logo{width:150px;height:56px}
.strategic-logo{width:198px;height:56px}
.nav{display:flex;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:600;font-size:14px;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;letter-spacing:.1px}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn svg{width:15px;height:15px;flex:none}
.primary{background:var(--navy);color:#fff;box-shadow:0 6px 16px -4px rgba(10,23,48,.35)}
.primary:hover{background:var(--navy2);box-shadow:0 10px 22px -4px rgba(10,23,48,.45)}
.light{background:#F1EEE4;color:var(--navy);box-shadow:none}
.light:hover{background:#E9E3D2}
.gold{background:linear-gradient(135deg,var(--gold-light),var(--gold) 45%,var(--gold2));color:#3A2C0F;position:relative;overflow:hidden;box-shadow:var(--shadow-gold)}
.gold:hover{box-shadow:0 14px 32px -6px rgba(169,124,46,.55)}
.gold:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 48%,transparent 62%);transform:translateX(-130%);transition:transform .7s ease}
.gold:hover:after{transform:translateX(130%)}
.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
.ghost:hover{border-color:var(--navy)}
.danger-btn{background:var(--danger-bg);color:var(--danger)}
.danger-btn:hover{background:#f6d9d7}
.btn.sm{padding:9px 13px;font-size:12.5px;border-radius:9px}
.btn[disabled]{opacity:.55;cursor:default;pointer-events:none;transform:none!important}

/* hero */
.hero{background:radial-gradient(140% 180% at 20% -10%,#1c3f70 0%,var(--navy) 45%,var(--navy-deep) 100%);color:#fff;text-align:center;padding:88px 20px 116px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(201,164,85,.06) 0 1px,transparent 1px 64px);pointer-events:none}
.hero:after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(201,164,85,.16),transparent 70%);top:-220px;right:-140px;pointer-events:none}
.hero .mark{width:56px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 26px;opacity:.9;position:relative;z-index:1}
.hero h1{font-size:46px;line-height:1.14;margin:0 0 16px;font-weight:600;position:relative;z-index:1}
.hero p{max-width:600px;margin:auto;color:#C9D6EA;font-size:16.5px;line-height:1.65;position:relative;z-index:1}
.hero-anim{animation:rise .7s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

.wrap{max-width:1140px;margin:auto;padding:30px 20px 50px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow-sm)}
.form{max-width:800px;margin:-72px auto 34px;position:relative;animation:rise .6s var(--ease) .1s both}
.card.form,.card.loginbox{border-top:3px solid var(--gold);box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.full{grid-column:1/-1}
.label{display:block;font-size:12px;font-weight:600;margin-bottom:8px;color:var(--navy);letter-spacing:.15px}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid #DCD5C4;border-radius:var(--radius-sm);background:#fff;outline:none;font-size:14.5px;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
input:hover,select:hover,textarea:hover{border-color:#CBBF9F}
input:focus,select:focus,textarea:focus{border-color:var(--gold2);box-shadow:0 0 0 4px rgba(201,164,85,.16)}
textarea{min-height:136px;resize:vertical;line-height:1.6}
.charcount{text-align:right;font-size:11.5px;color:var(--muted);margin-top:5px}
.stars{display:flex;gap:8px}
.star{font-size:38px;color:#E1D9C6;cursor:pointer;transition:transform .18s var(--ease),color .18s var(--ease);line-height:1}
.star:hover{transform:scale(1.15)}
.star.on{color:var(--gold);filter:drop-shadow(0 3px 8px rgba(169,124,46,.4))}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.muted{font-size:12.5px;color:var(--muted)}
.photo-row{display:flex;align-items:center;gap:12px}
.photo-thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;border:1px solid var(--line);display:none;box-shadow:var(--shadow-sm)}

/* login */
.login{min-height:calc(100vh - 80px);display:grid;place-items:center;padding:28px;position:relative;overflow:hidden}
.login:before{content:"";position:absolute;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(201,164,85,.12),transparent 70%);top:-280px;left:50%;transform:translateX(-50%);pointer-events:none}
.loginbox{width:min(440px,100%);text-align:center;position:relative}
.loginbox img{width:250px;height:60px;object-fit:contain}
.loginbox .field{text-align:left;margin:16px 0}
.loginbox h2{font-size:25px;margin-top:6px}
.link-btn{background:none;border:0;color:var(--navy3);font-weight:600;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0}

/* admin */
.adminhead{background:linear-gradient(125deg,var(--navy) 0%,var(--navy-deep) 100%);color:#fff;position:relative;overflow:hidden}
.adminhead:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(201,164,85,.05) 0 1px,transparent 1px 70px);pointer-events:none}
.adminhead .wrap{padding-bottom:76px;position:relative}
.adminrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.adminrow p{color:#B7C6DD;margin:6px 0 0;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:-46px;position:relative}
.stat{min-width:0}
.stat{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.stat:hover{transform:translateY(-3px)}
.stat .muted{text-transform:uppercase;letter-spacing:.5px;font-size:10.5px;font-weight:700}
.stat b{font-family:Fraunces,serif;font-size:32px;display:block;margin-top:8px;font-weight:600;color:var(--navy)}
.dash{display:grid;grid-template-columns:1fr 1.7fr;gap:20px;margin-top:24px;align-items:start}
.dash>.card{min-width:0}
.paneltitle{font-weight:700;margin-bottom:18px;font-size:15px;color:var(--navy)}
.metric{margin:15px 0}
.mtop{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}
.mtop b{font-weight:700}
.bar{height:8px;background:#F1ECDF;border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:20px;transition:width .6s var(--ease)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input,.toolbar select{max-width:220px}
.tablewrap{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:14px}
.table{border-collapse:collapse;width:100%;font-size:13px}
.table th{background:#F7F4EC;text-align:left;padding:13px 14px;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap}
.table td{padding:13px 14px;border-top:1px solid var(--line);white-space:nowrap}
.table tbody tr{transition:background .15s ease}
.table tbody tr:hover{background:#FBF9F3}
.badge{padding:5px 11px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block;letter-spacing:.2px}
.bnew{background:var(--new-bg);color:var(--new)}
.brev{background:var(--warn-bg);color:var(--warn)}
.bres{background:var(--ok-bg);color:var(--ok)}
.rowbtns{display:flex;gap:6px}
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty:before{content:"";display:block;width:44px;height:44px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(circle,var(--gold-tint),transparent 70%)}
.empty b{display:block;color:var(--navy);font-size:15.5px;margin-bottom:5px;font-family:Fraunces,serif;font-weight:600}

.modal{position:fixed;inset:0;background:rgba(8,16,32,.6);display:grid;place-items:center;padding:20px;z-index:30;backdrop-filter:blur(3px)}
.modalbox{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:30px;position:relative;box-shadow:var(--shadow)}
.close{position:absolute;top:18px;right:18px;border:0;border-radius:10px;background:#F1EEE4;font-size:18px;width:36px;height:36px;cursor:pointer;transition:background .15s ease}
.close:hover{background:#E9E3D2}
.hidden{display:none!important}
.error{color:var(--danger);background:var(--danger-bg);border-radius:10px;padding:12px 14px;font-size:13px;margin-top:11px}
.success{text-align:center;padding:40px 20px}
.success .check{width:68px;height:68px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:0 auto 16px;font-size:32px;box-shadow:0 8px 20px rgba(31,122,92,.18)}
.id{display:inline-flex;align-items:center;gap:10px;background:var(--gold-tint);color:var(--gold2);padding:13px 20px;border-radius:12px;font-weight:700;margin:16px 0;font-family:Fraunces,serif;font-size:18px}
.id button{border:0;background:#fff;border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--gold2);font-size:13px;transition:transform .15s ease}
.id button:hover{transform:scale(1.08)}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.spinner.dark{border:2px solid rgba(10,23,48,.15);border-top-color:var(--navy)}
@keyframes spin{to{transform:rotate(360deg)}}
.loadwrap{display:flex;align-items:center;justify-content:center;gap:10px;padding:70px 0;color:var(--muted)}

/* toasts */
.toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:10px;z-index:60;max-width:320px}
.toast{background:#fff;border-left:4px solid var(--navy);border-radius:12px;padding:14px 18px;box-shadow:0 16px 40px -8px rgba(8,18,38,.25);font-size:13.5px;animation:toastin .3s var(--ease)}
.toast.ok{border-color:var(--ok)}
.toast.err{border-color:var(--danger)}
@keyframes toastin{from{opacity:0;transform:translateX(20px) scale(.97)}to{opacity:1;transform:translateX(0) scale(1)}}

footer{text-align:center;padding:30px 20px 46px;color:var(--muted);font-size:12px;position:relative}
footer:before{content:"";display:block;width:40px;height:1px;background:var(--line);margin:0 auto 16px}

@media(max-width:850px){
  .grid,.dash{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .brand{gap:12px}
  .jinnah-logo{width:120px;height:46px}
  .strategic-logo{width:158px;height:46px}
  .hero h1{font-size:34px}
}
@media(max-width:520px){
  .top{padding:9px 14px}
  .brand{gap:7px}
  .jinnah-logo{width:96px;height:42px}
  .strategic-logo{width:118px;height:42px}
  .nav{gap:6px}
  .nav .btn{padding:9px 12px;font-size:12.5px}
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .stat{padding:15px}
  .stat b{font-size:23px}
  .hero{padding:56px 16px 92px}
  .hero h1{font-size:28px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand" onclick="home()" style="cursor:pointer" title="Jinnah Icon Mall Feedback Portal">
    <img class="jinnah-logo" src="assets/jinnah-icon-logo.jpg" alt="Jinnah Icon Mall">
  </div>
  <img class="strategic-logo" src="assets/strategic-enterprises-logo.jpg" alt="Strategic Enterprises">
</header>
<div id="app"></div>
<div id="modal" class="modal hidden"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><div id="modalbody"></div></div></div>
<div id="toasts" class="toasts"></div>
<script>
const SUPABASE_URL="https://lvdmybwgjmzanovttjtu.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_N9U_MomjK3GK3_JaJyPzqg_zyNp7za3";
const ready=SUPABASE_URL.startsWith("https://") && SUPABASE_PUBLISHABLE_KEY.startsWith("sb_publishable_");
const sb=ready?supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
let rating=0, data=[], sortKey="created_at", sortDir="desc", myRole="user", team=[], myId=null;
const roleLabel={owner:"Owner",admin:"Admin",user:"Viewer",pending:"Pending"};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

/* ---------- toast helper ---------- */
function toast(msg,type){
  const el=document.createElement("div");
  el.className="toast"+(type?" "+type:"");
  el.textContent=msg;
  toasts.appendChild(el);
  setTimeout(()=>{el.style.transition="opacity .3s";el.style.opacity="0";setTimeout(()=>el.remove(),300)},4200);
}

const icon={
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3m-8 0l1 13h8l1-13"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>',
  logout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>'
};

function setupWarning(){return !ready?'<div class="wrap"><div class="card error"><b>Portal is not connected yet.</b><br>Paste your Supabase Project URL and Publishable Key at the top of the script in <b>index.html</b>. SETUP.md explains where to get them.</div></div>':''}

/* ---------- customer form ---------- */
function home(){
  rating=0;
  app.innerHTML=`
  <section class="hero"><div class="hero-anim">
    <div class="mark"></div>
    <h1>We Value Your Experience</h1>
    <p>Tell us about your visit to Jinnah Icon Mall — a complaint, a suggestion, a word of appreciation, or anything in between. Our team reads every submission.</p>
  </div></section>
  <div class="wrap">
    <div class="card form">
      <form onsubmit="send(event)">
        <div class="grid">
          <div><label class="label">Feedback Type *</label>
            <select id="type" required><option value="">Select type</option><option>General Feedback</option><option>Complaint</option><option>Suggestion</option><option>Appreciation</option><option>Service Issue</option></select>
          </div>
          <div><label class="label">Area / Location</label>
            <select id="area"><option value="">Select area</option><option>Ground Floor</option><option>First Floor</option><option>Second Floor</option><option>Food Court</option><option>Parking</option><option>Prayer Room</option><option>Washroom</option><option>CSR Desk</option><option>Other</option></select>
          </div>
          <div class="full">
            <label class="label">Rate Your Experience *</label>
            <div class="stars">${[1,2,3,4,5].map(n=>`<span class="star" id="s${n}" onclick="setRating(${n})">★</span>`).join("")}</div>
            <div class="muted" id="ratelabel">1 = Very Poor • 5 = Excellent</div>
          </div>
          <div><label class="label">Name</label><input id="name" placeholder="Optional"></div>
          <div><label class="label">Contact Number</label><input id="phone" placeholder="Optional"></div>
          <div class="full">
            <label class="label">Your Feedback *</label>
            <textarea id="message" required placeholder="Please share your experience..." maxlength="600" oninput="charcount.textContent=message.value.length+' / 600'"></textarea>
            <div class="charcount" id="charcount">0 / 600</div>
          </div>
          <div><label class="label">Email</label><input id="email" type="email" placeholder="Optional"></div>
          <div>
            <label class="label">Photo (optional)</label>
            <div class="photo-row">
              <input id="photo" type="file" accept="image/*" onchange="previewPhoto(event)">
              <img id="photoThumb" class="photo-thumb">
            </div>
            <div class="muted">Image is uploaded securely to the portal storage.</div>
          </div>
        </div>
        <div class="actions">
          <button type="button" class="btn light" onclick="home()">Clear</button>
          <button class="btn gold" id="submitBtn"><span>Submit Feedback</span></button>
        </div>
      </form>
    </div>${setupWarning()}
  </div>
  <footer>Jinnah Icon Mall — Customer Experience Desk</footer>`;
}
function previewPhoto(e){const f=e.target.files[0];if(!f)return;photoThumb.src=URL.createObjectURL(f);photoThumb.style.display="block"}
function setRating(n){rating=n;for(let i=1;i<=5;i++)document.getElementById("s"+i).classList.toggle("on",i<=n);const labels={1:"Very Poor",2:"Poor",3:"Average",4:"Good",5:"Excellent"};ratelabel.textContent="Your rating: "+labels[n]}
function fid(){return "JIM-"+new Date().getFullYear()+"-"+Math.random().toString(36).slice(2,7).toUpperCase()}

async function send(e){
  e.preventDefault();
  if(!ready)return toast("Portal database is not connected yet. Follow SETUP.md.","err");
  if(!rating)return toast("Please select a rating.","err");
  const btn=submitBtn;btn.disabled=true;btn.innerHTML='<span class="spinner"></span><span>Submitting…</span>';
  let id=fid(), file=document.getElementById("photo").files[0], photo_path=null;
  try{
    if(file){
      let ext=(file.name.split(".").pop()||"jpg").toLowerCase(), path=id+"-"+crypto.randomUUID()+"."+ext;
      let up=await sb.storage.from("feedback-photos").upload(path,file,{upsert:false});
      if(up.error)throw new Error("Photo upload failed: "+up.error.message);
      photo_path=path;
    }
    let {error}=await sb.from("feedback").insert({feedback_id:id,type:type.value,area:area.value||null,rating,name:name.value||null,phone:phone.value||null,email:email.value||null,message:message.value,photo_path});
    if(error)throw new Error(error.message);
    success(id);
  }catch(err){
    toast(err.message,"err");
    btn.disabled=false;btn.innerHTML='<span>Submit Feedback</span>';
  }
}
function copyId(id){navigator.clipboard?.writeText(id);toast("Feedback ID copied","ok")}
function success(id){
  app.innerHTML=`<div class="wrap"><div class="card success">
    <div class="check">✓</div>
    <h2>Thank You for Your Feedback!</h2>
    <p class="muted">Your feedback has been submitted successfully and our team has been notified.</p>
    <div class="id">${id}<button onclick="copyId('${id}')" title="Copy">⧉</button></div>
    <p class="muted">Please keep this Feedback ID for your reference.</p>
    <button class="btn primary" onclick="home()">Submit Another Feedback</button>
  </div></div>`;
}

/* ---------- admin login ---------- */
function login(){
  app.innerHTML=`<div class="login"><div class="card loginbox">
    <div class="brand" style="justify-content:center;gap:22px;margin-bottom:14px">
      <img class="jinnah-logo" src="assets/jinnah-icon-logo.jpg" alt="Jinnah Icon Mall">
      <img class="strategic-logo" src="assets/strategic-enterprises-logo.jpg" alt="Strategic Enterprises">
    </div>
    <h2>Admin Portal</h2>
    <p class="muted">Sign in to review and manage customer feedback.</p>
    <form onsubmit="signin(event)">
      <div class="field"><label class="label">Admin Email</label><input id="lemail" type="email" required placeholder="admin@company.com"></div>
      <div class="field"><label class="label">Password</label><input id="lpass" type="password" required placeholder="Password"></div>
      <div id="loginerr"></div>
      <button class="btn primary" id="loginBtn" style="width:100%;justify-content:center;margin-top:4px"><span>Login</span></button>
    </form>
    <p style="margin-top:14px"><button class="link-btn" onclick="forgotPassword()">Forgot password?</button></p>
    <p class="muted" style="margin-top:14px">New here? Create your account in Supabase Authentication first — the portal owner then sets your access level (Owner / Admin / Viewer) from the Team &amp; Access panel.</p>
  </div></div>`;
}
async function signin(e){
  e.preventDefault();
  if(!ready)return toast("Connect Supabase first.","err");
  const btn=loginBtn;btn.disabled=true;btn.innerHTML='<span class="spinner"></span><span>Signing in…</span>';
  let {error}=await sb.auth.signInWithPassword({email:lemail.value,password:lpass.value});
  if(error){loginerr.innerHTML='<div class="error">'+esc(error.message)+'</div>';btn.disabled=false;btn.innerHTML='<span>Login</span>';return}
  dashboard();
}
function forgotPassword(){
  app.innerHTML=`<div class="login"><div class="card loginbox">
    <h2>Reset Password</h2>
    <p class="muted">Enter your admin email and we'll send a password reset link.</p>
    <form onsubmit="sendReset(event)">
      <div class="field"><label class="label">Admin Email</label><input id="remail" type="email" required placeholder="admin@company.com"></div>
      <div id="reseterr"></div>
      <button class="btn primary" id="resetBtn" style="width:100%;justify-content:center;margin-top:4px"><span>Send Reset Link</span></button>
    </form>
    <p style="margin-top:14px"><button class="link-btn" onclick="login()">Back to login</button></p>
  </div></div>`;
}
async function sendReset(e){
  e.preventDefault();
  if(!ready)return toast("Connect Supabase first.","err");
  const btn=resetBtn;btn.disabled=true;btn.innerHTML='<span class="spinner"></span><span>Sending…</span>';
  let {error}=await sb.auth.resetPasswordForEmail(remail.value);
  btn.disabled=false;btn.innerHTML='<span>Send Reset Link</span>';
  if(error)return reseterr.innerHTML='<div class="error">'+esc(error.message)+'</div>';
  toast("Reset link sent if the account exists.","ok");
  login();
}

/* ---------- dashboard ---------- */
async function dashboard(){
  app.innerHTML='<div class="loadwrap"><span class="spinner dark"></span> Loading dashboard…</div>';
  let {data:u}=await sb.auth.getUser();
  if(!u.user)return login();
  myId=u.user.id;
  let p=await sb.from("profiles").select("full_name,role").eq("id",u.user.id).single();
  if(p.error)return app.innerHTML=`<div class="login"><div class="card loginbox"><h2>Admin Check Error</h2><p class="error">${esc(p.error.message)}</p><button class="btn primary" onclick="dashboard()">Retry</button></div></div>`;
  if(!["owner","admin","user"].includes(p.data?.role)){
    await sb.auth.signOut();
    return app.innerHTML='<div class="login"><div class="card loginbox"><h2>Access Pending</h2><p class="muted">Your account exists but is not approved yet. Please contact an existing owner/administrator.</p><button class="btn primary" onclick="login()">Back to Login</button></div></div>';
  }
  myRole=p.data.role;
  let q=await sb.from("feedback").select("*").order("created_at",{ascending:false});
  if(q.error)return toast(q.error.message,"err");
  data=q.data||[];
  if(myRole==="owner"){
    let t=await sb.from("profiles").select("id,full_name,email,role,created_at").order("created_at",{ascending:true});
    team=t.data||[];
  }
  renderDash(p.data?.full_name);
}

function renderDash(name){
  let total=data.length,today=new Date().toDateString(),tc=data.filter(f=>new Date(f.created_at).toDateString()===today).length,
      avg=total?(data.reduce((a,f)=>a+f.rating,0)/total).toFixed(1):"0.0",
      res=data.filter(f=>f.status==="Resolved").length,
      pending=total-res;
  const types=["Complaint","Suggestion","Appreciation","General Feedback","Service Issue"];
  const areas=[...new Set(data.map(f=>f.area).filter(Boolean))];
  const areaCounts=areas.map(a=>({a,c:data.filter(f=>f.area===a).length})).sort((x,y)=>y.c-x.c).slice(0,6);

  app.innerHTML=`
  <section class="adminhead"><div class="wrap">
    <div class="adminrow">
      <div><h1>Feedback Dashboard</h1><p>${name?esc(name)+" · ":""}Jinnah Icon Mall · Customer Experience Management · <span style="color:var(--gold);font-weight:700">${roleLabel[myRole]}</span></p></div>
      <button class="btn light" onclick="logout()">${icon.logout}<span>Logout</span></button>
    </div>
  </div></section>
  <div class="wrap">
    <div class="stats">
      <div class="stat"><span class="muted">Total Feedback</span><b>${total}</b></div>
      <div class="stat"><span class="muted">Received Today</span><b>${tc}</b></div>
      <div class="stat"><span class="muted">Average Rating</span><b>★ ${avg}</b></div>
      <div class="stat"><span class="muted">Resolved · Pending</span><b>${res} · ${pending}</b></div>
    </div>
    <div class="dash">
      <div class="card">
        <div class="paneltitle">Rating Distribution</div>
        ${[5,4,3,2,1].map(r=>{let c=data.filter(f=>f.rating===r).length,pc=total?c/total*100:0;return `<div class="metric"><div class="mtop"><span>${r} Star</span><b>${c}</b></div><div class="bar"><i style="width:${pc}%"></i></div></div>`}).join("")}
        <div class="paneltitle" style="margin-top:26px">Feedback by Category</div>
        ${types.map(t=>{let c=data.filter(f=>f.type===t).length,pc=total?c/total*100:0;return `<div class="metric"><div class="mtop"><span>${t}</span><b>${c}</b></div><div class="bar"><i style="width:${pc}%"></i></div></div>`}).join("")}
        ${areaCounts.length?(`<div class="paneltitle" style="margin-top:26px">Top Areas Mentioned</div>`+areaCounts.map(x=>{let pc=total?x.c/total*100:0;return `<div class="metric"><div class="mtop"><span>${esc(x.a)}</span><b>${x.c}</b></div><div class="bar"><i style="width:${pc}%"></i></div></div>`}).join("")):""}
      </div>
      <div class="card">
        <div class="paneltitle">Customer Feedback</div>
        <div class="toolbar">
          <input id="search" placeholder="Search feedback…" oninput="filterRows()">
          <select id="status" onchange="filterRows()"><option value="">All Status</option><option>New</option><option>In Review</option><option>Resolved</option></select>
          <select id="sortsel" onchange="sortChange()">
            <option value="created_at-desc">Newest first</option>
            <option value="created_at-asc">Oldest first</option>
            <option value="rating-desc">Highest rating</option>
            <option value="rating-asc">Lowest rating</option>
          </select>
          <button class="btn ghost sm" onclick="exportCsv()">${icon.download}<span>Export CSV</span></button>
        </div>
        <div class="tablewrap"><table class="table">
          <thead><tr><th>Feedback ID</th><th>Date</th><th>Type</th><th>Rating</th><th>Customer</th><th>Status</th><th></th></tr></thead>
          <tbody id="rows">${rows()}</tbody>
        </table></div>
      </div>
    </div>
    ${poorPanel()}
    ${myRole==="owner"?teamPanel():""}
  </div>`;
}

function poorPanel(){
  const poor=data.filter(f=>f.rating<3).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  return `<div class="card" style="margin-top:18px;border-top:3px solid var(--danger)">
    <div class="paneltitle" style="color:var(--danger)">⚠ Needs Attention — Poor Ratings (Below 3★) · ${poor.length}</div>
    <div class="tablewrap"><table class="table">
      <thead><tr><th>Feedback ID</th><th>Date</th><th>Type</th><th>Rating</th><th>Customer</th><th>Status</th><th></th></tr></thead>
      <tbody>${poor.length?poor.map(f=>{const i=data.indexOf(f);return `<tr><td><b>${esc(f.feedback_id)}</b></td><td>${new Date(f.created_at).toLocaleDateString()}</td><td>${esc(f.type)}</td><td style="color:var(--danger)">${"★".repeat(f.rating)}${"☆".repeat(5-f.rating)}</td><td>${esc(f.name||"Anonymous")}</td><td><span class="badge ${f.status==="Resolved"?"bres":f.status==="In Review"?"brev":"bnew"}">${f.status}</span></td><td><button class="btn light sm" onclick="view(${i})">${icon.eye}</button></td></tr>`}).join(""):`<tr><td colspan="7"><div class="empty"><b>No poor ratings</b>Feedback under 3 stars will show up here.</div></td></tr>`}</tbody>
    </table></div>
  </div>`;
}

function teamPanel(){
  return `<div class="card" style="margin-top:18px">
    <div class="paneltitle">Team &amp; Access</div>
    <p class="muted" style="margin:-8px 0 14px">Owner can approve pending accounts and set each person's access level.</p>
    <div class="tablewrap"><table class="table">
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr></thead>
      <tbody>${team.map(m=>{const isMe=m.id===myId;return `<tr data-id="${m.id}"><td><b>${esc(m.full_name||"—")}</b>${isMe?' <span class="muted">(you)</span>':""}</td><td>${esc(m.email||"—")}</td>
        <td><select id="role-${m.id}" ${isMe?"disabled":""}>
          ${["pending","user","admin","owner"].map(r=>`<option value="${r}" ${m.role===r?"selected":""}>${roleLabel[r]}</option>`).join("")}
        </select></td>
        <td>${isMe?"":`<button class="btn primary sm" onclick="updateRole('${m.id}')">Save</button>`}</td></tr>`}).join("")}
      </tbody>
    </table></div>
  </div>`;
}

async function updateRole(id){
  const sel=document.getElementById("role-"+id), newRole=sel.value;
  let {error}=await sb.from("profiles").update({role:newRole}).eq("id",id);
  if(error)return toast(error.message,"err");
  toast("Access level updated","ok");
  await dashboard();
}

function sortChange(){const[k,d]=sortsel.value.split("-");sortKey=k;sortDir=d;data.sort((a,b)=>{let av=a[sortKey],bv=b[sortKey];if(sortKey==="created_at"){av=new Date(av);bv=new Date(bv)}return sortDir==="asc"?(av>bv?1:-1):(av<bv?1:-1)});document.getElementById("rows").innerHTML=rows();filterRows()}

function rows(){
  return data.length?data.map((f,i)=>`<tr data-i="${i}"><td><b>${esc(f.feedback_id)}</b></td><td>${new Date(f.created_at).toLocaleDateString()}</td><td>${esc(f.type)}</td><td style="color:#C6A15B">${"★".repeat(f.rating)}${"☆".repeat(5-f.rating)}</td><td>${esc(f.name||"Anonymous")}</td><td><span class="badge ${f.status==="Resolved"?"bres":f.status==="In Review"?"brev":"bnew"}">${f.status}</span></td><td><div class="rowbtns"><button class="btn light sm" onclick="view(${i})">${icon.eye}</button>${myRole==="owner"?`<button class="btn danger-btn sm" onclick="removeFeedback(${i})">${icon.trash}</button>`:""}</div></td></tr>`).join(""):
  `<tr><td colspan="7"><div class="empty"><b>No feedback yet</b>Submissions from customers will appear here as soon as they arrive.</div></td></tr>`;
}

function filterRows(){
  let q=(search.value||"").toLowerCase(),s=status.value;
  document.querySelectorAll("#rows tr[data-i]").forEach(r=>{let t=r.innerText.toLowerCase();r.style.display=(!q||t.includes(q))&&(!s||t.includes(s.toLowerCase()))?"":"none"});
}

function exportCsv(){
  if(!data.length)return toast("No feedback to export yet.","err");
  const headers=["Feedback ID","Date","Type","Area","Rating","Name","Phone","Email","Message","Status","Admin Remarks"];
  const rowsCsv=data.map(f=>[f.feedback_id,new Date(f.created_at).toLocaleString(),f.type,f.area||"",f.rating,f.name||"",f.phone||"",f.email||"",(f.message||"").replace(/\n/g," "),f.status,(f.admin_remark||"").replace(/\n/g," ")]);
  const csv=[headers,...rowsCsv].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="jinnah-icon-mall-feedback-"+new Date().toISOString().slice(0,10)+".csv";a.click();
  URL.revokeObjectURL(url);
  toast("CSV exported","ok");
}

async function view(i){
  let f=data[i],photo="";
  if(f.photo_path){let x=await sb.storage.from("feedback-photos").createSignedUrl(f.photo_path,300);if(x.data?.signedUrl)photo=`<div class="full"><label class="label">Attachment</label><img src="${x.data.signedUrl}" style="max-width:100%;max-height:260px;border-radius:10px"></div>`}
  modalbody.innerHTML=`<h2>${esc(f.feedback_id)}</h2>
  <div class="grid" style="margin-top:16px">
    <div><label class="label">Customer</label>${esc(f.name||"Anonymous")}</div>
    <div><label class="label">Contact</label>${esc(f.phone||"—")}</div>
    <div><label class="label">Email</label>${esc(f.email||"—")}</div>
    <div><label class="label">Date</label>${new Date(f.created_at).toLocaleString()}</div>
    <div><label class="label">Type</label>${esc(f.type)}</div>
    <div><label class="label">Area</label>${esc(f.area||"—")}</div>
    <div class="full"><label class="label">Rating</label><span style="color:#C6A15B;font-size:24px">${"★".repeat(f.rating)}${"☆".repeat(5-f.rating)}</span></div>
    <div class="full"><label class="label">Feedback</label><div style="background:#FAF8F3;padding:14px;border-radius:10px;line-height:1.6">${esc(f.message)}</div></div>
    <div class="full"><label class="label">Status</label>${myRole==="owner"?`<select id="mstatus"><option ${f.status==="New"?"selected":""}>New</option><option ${f.status==="In Review"?"selected":""}>In Review</option><option ${f.status==="Resolved"?"selected":""}>Resolved</option></select>`:`<select id="mstatus" disabled><option selected>${esc(f.status)}</option></select>`}</div>
    <div class="full"><label class="label">Admin Remarks</label>${myRole==="user"?`<textarea id="mremark" disabled>${esc(f.admin_remark||"No remarks yet.")}</textarea>`:`<textarea id="mremark" placeholder="Add your remarks after reviewing this feedback…">${esc(f.admin_remark||"")}</textarea>`}</div>
    ${photo}
  </div>
  <div class="actions">
    ${myRole==="owner"?`<button class="btn danger-btn" onclick="removeFeedback(${i},true)">${icon.trash}<span>Delete</span></button>`:""}
    ${myRole!=="user"?`<button class="btn primary" onclick="saveFeedback('${f.id}')"><span>Save Changes</span></button>`:""}
  </div>`;
  modal.classList.remove("hidden");
}
async function saveFeedback(id){
  let {error}=await sb.from("feedback").update({status:mstatus.value,admin_remark:mremark.value}).eq("id",id);
  if(error)return toast(error.message,"err");
  closeModal();toast("Feedback updated","ok");await dashboard();
}
async function removeFeedback(i,fromModal){
  let f=data[i];
  if(!confirm("Delete feedback "+f.feedback_id+"? This cannot be undone."))return;
  if(f.photo_path)await sb.storage.from("feedback-photos").remove([f.photo_path]);
  let {error}=await sb.from("feedback").delete().eq("id",f.id);
  if(error)return toast(error.message,"err");
  if(fromModal)closeModal();
  toast("Feedback deleted","ok");
  await dashboard();
}
function closeModal(){modal.classList.add("hidden")}
async function logout(){await sb.auth.signOut();location.hash="";home()}
window.addEventListener("hashchange",()=>{if(location.hash==="#admin")login()});
if(location.hash==="#admin")login();else home();
</script>
</body></html>
